<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!-- Structured data for search engines and AI agents -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Giuliano Formisano",
      "jobTitle": "Postdoctoral Research Fellow in Political Science",
      "affiliation": {
        "@type": "Organization",
        "name": "University of Zurich"
      },
      "url": "https://giulianoformisano.github.io",
      "sameAs": [
        "https://scholar.google.com/citations?user=UiTr2SwAAAAJ&hl=en",
        "https://github.com/giulianoformisano",
        "https://www.linkedin.com/in/giulianoformisano/"
      ],
      "knowsAbout": [
        "Political Communication",
        "Digital Politics",
        "Computational Social Science",
        "Machine Learning",
        "Natural Language Processing",
        "Political Polarization",
        "Social Media Analysis"
      ]
    }
    </script>

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/0bd93a3cce.js" crossorigin="anonymous"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}" />

    <!-- RSS -->
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ '/favicon.ico' | relative_url }}">

    <!-- Cache-Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">

          <div class="site-info">
            <h1 class="site-name">
              <a href="{{ site.baseurl }}/">{{ site.name }}</a>
            </h1>

            <p class="site-description">
              {{ site.description }}
            </p>
          </div>

          <div class="menu-container" style="text-align:center;">
            <nav style="display:inline-block;">
              <a href="{{ site.baseurl }}/">Home</a>
              <a href="{{ site.baseurl }}/research">Research</a>
              <a href="{{ site.baseurl }}/teaching">Teaching</a>
              <a href="{{ site.baseurl }}/files/GFormisano_CV.pdf?v={{ site.time | date: '%Y%m%d%H%M' }}" 
                 target="_blank" 
                 rel="noopener noreferrer">
                 CV
              </a>
            </nav>
          </div>

        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    {% include analytics.html %}
  </body>
</html>
